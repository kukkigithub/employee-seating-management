<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seating Chart — Office Floor Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark">SEAT/OS</span>
    <h1>Employee Seating Management</h1>
  </div>
  <div class="nav-links">
    <a href="/" class="active">Floor Plan</a>
    <a href="/admin.html">Admin · AI Assistant</a>
  </div>
</div>

<main>
  <div class="page-head">
    <span class="eyebrow">Live Occupancy</span>
    <h2>Seating chart</h2>
    <p>Every desk across both floors, grouped by wing. Click any seat to assign or vacate it.</p>
  </div>

  <div class="controls-row">
    <input type="text" id="search" placeholder="Search employee or seat code…">
    <select id="deptFilter">
      <option value="">All departments</option>
    </select>
    <div class="legend">
      <span><span class="swatch" style="background:#c17f3e"></span>Occupied</span>
      <span><span class="swatch" style="background:#5c7a5e"></span>Open</span>
    </div>
  </div>

  <div id="floors"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalSeatLabel">Seat</h3>
    <span class="sub" id="modalSeatMeta">—</span>
    <select id="employeeSelect">
      <option value="">— Vacant (no one assigned) —</option>
    </select>
    <div class="btn-row">
      <button class="btn secondary" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
